<div class="heatmap_container">
    <div class="heatmap_content">
        <div class="heatmap_weekdays">
            <span>Mon</span>
            <span>&nbsp;</span>
            <span>Wed</span>
            <span>&nbsp;</span>
            <span>Fri</span>
            <span>&nbsp;</span>
            <span>Sun</span>
        </div>
        <div class="heatmap_main">
            <div class="heatmap_month" id="heatmap-months"></div>
            <div class="heatmap_grid" id="heatmap"></div>
        </div>
    </div>
    <div class="heatmap_footer">
        <div class="heatmap_less">Less</div>
        <div class="heatmap_level">
            <span class="heatmap_level_item heatmap_level_0"></span>
            <span class="heatmap_level_item heatmap_level_1"></span>
            <span class="heatmap_level_item heatmap_level_2"></span>
            <span class="heatmap_level_item heatmap_level_3"></span>
            <span class="heatmap_level_item heatmap_level_4"></span>
        </div>
        <div class="heatmap_more">More</div>
    </div>
    <!-- 单例 tooltip，避免频繁创建/销毁 DOM -->
    <div class="heatmap_tooltip" id="heatmap-tooltip"></div>
</div>

<style>
    :root {
    --ht-main: #334155;
    --ht-day-bg: #ebedf0;
    --ht-tooltip: #fff;
    --ht-tooltip-bg: #24292f;
    --ht-lv-0: #ebedf0;
    --ht-lv-1: #9be9a8;
    --ht-lv-2: #40c463;
    --ht-lv-3: #30a14e;
    --ht-lv-4: #216e39;
}

[data-theme="dark"] {
    --ht-main: #94a3b8;
    --ht-day-bg: #161b22;
    --ht-tooltip: #24292f;
    --ht-tooltip-bg: #fff;
    --ht-lv-0: #161b22;
    --ht-lv-1: #0e4429;
    --ht-lv-2: #006d32;
    --ht-lv-3: #26a641;
    --ht-lv-4: #39d353;
}

.heatmap_container {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    line-height: 12px;
    color: var(--ht-main);
    position: relative;
    overflow: visible;
}

.heatmap_content {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    width: 100%;
}

.heatmap_weekdays {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    text-align: right;
    margin-top: 0.25rem;
    margin-right: 0.25rem;
    flex-shrink: 0;
}

.heatmap_main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    flex: 1;
}

.heatmap_month {
    display: flex;
    margin-top: 0.25rem;
    margin-right: 0.25rem;
    flex-direction: row;
    justify-content: space-around;
    align-items: flex-end;
    text-align: right;
}

.heatmap_grid {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    height: 84px;
}

.heatmap_footer {
    display: flex;
    margin-top: 0.5rem;
    align-items: center;
    align-self: flex-end;
}

.heatmap_level {
    display: flex;
    gap: 2px;
    margin: 0 0.25rem;
    flex-direction: row;
    align-items: center;
    width: max-content;
    height: 10px;
}

.heatmap_level_item {
    display: block;
    border-radius: 0.125rem;
    width: 10px;
    height: 10px;
}

.heatmap_level_0 { background: var(--ht-lv-0); }
.heatmap_level_1 { background: var(--ht-lv-1); }
.heatmap_level_2 { background: var(--ht-lv-2); }
.heatmap_level_3 { background: var(--ht-lv-3); }
.heatmap_level_4 { background: var(--ht-lv-4); }

.heatmap_week {
    display: flex;
    flex-direction: column;
}

.heatmap_day {
    width: 10px;
    height: 10px;
    background-color: var(--ht-day-bg);
    margin: 1px;
    border-radius: 2px;
    display: inline-block;
}

.heatmap_day_level_0 { background-color: var(--ht-lv-0); }
.heatmap_day_level_1 { background-color: var(--ht-lv-1); }
.heatmap_day_level_2 { background-color: var(--ht-lv-2); }
.heatmap_day_level_3 { background-color: var(--ht-lv-3); }
.heatmap_day_level_4 { background-color: var(--ht-lv-4); }

.heatmap_tooltip {
    position: fixed;
    display: none;
    color: var(--ht-tooltip);
    background-color: var(--ht-tooltip-bg);
    font-size: 12px;
    line-height: 18px;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: pre-wrap;
    z-index: 1000;
    text-align: left;
    pointer-events: none;
    max-width: 260px;
}

.heatmap_tooltip.is-visible {
    display: block;
}

.heatmap_tooltip_date {
    display: block;
    font-size: 11px;
}

.heatmap_tooltip_title {
    display: block;
    margin-top: 4px;
    font-weight: 600;
}

</style>

<script>
(function() {
    // Hugo 在构建时注入文章数据（仅标题和日期，去掉 word_count）
    {{ $pages := where .Site.RegularPages "Date" ">" (now.AddDate -1 0 0) }}
    {{ $pages := $pages.Reverse }}
    var blogPages = [
        {{ range $index, $element := $pages }}
            {
                "title": "{{ replace (replace .Title "《" "〈") "》" "〉" }}",
                "date": "{{ .Date.Format "2006-01-02" }}"
            }{{ if ne (add $index 1) (len $pages) }},{{ end }}
        {{ end }}
    ];

    // 按日期索引，避免每个格子都 filter 整个列表
    var pagesByDate = {};
    for (var i = 0; i < blogPages.length; i++) {
        var p = blogPages[i];
        if (!pagesByDate[p.date]) pagesByDate[p.date] = [];
        pagesByDate[p.date].push(p);
    }

    var numMonths = window.innerWidth < 768 ? 6 : 12;
    var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var today = new Date();

    // 生成月份标签
    var monthDiv = document.getElementById('heatmap-months');
    var startMonthIndex = (today.getMonth() - (numMonths - 1) + 12) % 12;
    for (var m = 0; m < numMonths; m++) {
        var span = document.createElement('span');
        span.textContent = monthNames[(startMonthIndex + m) % 12];
        monthDiv.appendChild(span);
    }

    // 计算起始日期（numMonths 个月前的月初，对齐到周一）
    function getStartDate() {
        var d = new Date(today.getFullYear(), today.getMonth() - numMonths + 1, 1);
        while (d.getDay() !== 1) d.setDate(d.getDate() + 1);
        return d;
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function toDateKey(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function formatDateDisplay(d) {
        return monthNames[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }

    // 按篇数决定颜色等级
    function getLevel(postCount) {
        if (postCount === 0) return 0;
        if (postCount === 1) return 1;
        if (postCount === 2) return 2;
        if (postCount === 3) return 3;
        return 4;
    }

    // 单例 tooltip
    var tooltip = document.getElementById('heatmap-tooltip');

    function showTooltip(ev, dateStr, articles) {
        var html = '<span class="heatmap_tooltip_date">' + dateStr + '</span>';
        if (articles && articles.length > 0) {
            var titles = [];
            for (var i = 0; i < articles.length; i++) {
                titles.push(articles[i].title);
            }
            html += '<span class="heatmap_tooltip_title">' + titles.join(', ') + '</span>';
        }
        tooltip.innerHTML = html;
        tooltip.classList.add('is-visible');
        positionTooltip(ev);
    }

    function positionTooltip(ev) {
        var rect = ev.target.getBoundingClientRect();
        var tw = tooltip.offsetWidth;
        var th = tooltip.offsetHeight;
        var left = rect.left + rect.width / 2 - tw / 2;
        var top = rect.top - th - 6;
        // 防止超出左右边界
        if (left < 4) left = 4;
        if (left + tw > window.innerWidth - 4) left = window.innerWidth - 4 - tw;
        // 如果上方放不下，放到下方
        if (top < 4) top = rect.bottom + 6;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
    }

    function hideTooltip() {
        tooltip.classList.remove('is-visible');
    }

    // 构建热力图
    var container = document.getElementById('heatmap');
    var startDate = getStartDate();
    var endDate = new Date();
    var cur = new Date(startDate);
    var dayIndex = 0;
    var week = null;

    while (cur <= endDate) {
        if (dayIndex % 7 === 0) {
            week = document.createElement('div');
            week.className = 'heatmap_week';
            container.appendChild(week);
        }

        var key = toDateKey(cur);
        var articles = pagesByDate[key] || null;
        var postCount = articles ? articles.length : 0;
        var level = getLevel(postCount);

        var day = document.createElement('div');
        day.className = 'heatmap_day heatmap_day_level_' + level;

        // 用闭包保存数据供事件使用
        (function(dateDisplay, arts) {
            day.addEventListener('mouseenter', function(e) { showTooltip(e, dateDisplay, arts); });
            day.addEventListener('mouseleave', hideTooltip);
        })(formatDateDisplay(cur), articles);

        week.appendChild(day);

        dayIndex++;
        cur.setDate(cur.getDate() + 1);
    }
})();
</script>
